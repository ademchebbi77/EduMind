name: edumind-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: edumind-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-edumind-dev-metrics-token}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - edumind-prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle

  grafana:
    image: grafana/grafana:12.1.0
    container_name: edumind-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-edumind}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - edumind-grafana-data:/var/lib/grafana

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: edumind-postgres-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER:-edumind}:${DB_PASSWORD:-edumind_dev_password}@host.docker.internal:${DB_PORT:-5432}/${DB_NAME:-edumind}?sslmode=disable"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  edumind-prometheus-data:
  edumind-grafana-data:
