server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Course videos can be up to 500 MB.
    client_max_body_size 550m;

    # Django API and admin.
    location ~ ^/(api|admin)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    # Django static files (admin), collected into a shared volume.
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 7d;
    }

    # Hashed Vite assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths load index.html. (Django sets these headers itself
    # on API responses, so they are only added here.)
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri /index.html;
    }
}
