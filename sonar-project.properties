# SonarQube analysis of EduMind (Django backend + React frontend).
sonar.projectKey=edumind
sonar.projectName=EduMind
sonar.sourceEncoding=UTF-8

# Django apps are listed one by one so the scanner never walks Backend/.venv or media.
# Add new apps here.
sonar.sources=Backend/accounts,Backend/announcements,Backend/assessments,Backend/config,Backend/courses,Backend/sessions,Backend/summaries,Backend/voice_qa,Frontend/src
sonar.tests=Backend/accounts,Backend/announcements,Backend/assessments,Backend/config,Backend/courses,Backend/sessions,Backend/summaries,Backend/voice_qa,Frontend/src
sonar.test.inclusions=Backend/**/tests/**,Backend/**/test_*.py,Frontend/src/**/*.test.js,Frontend/src/**/*.test.jsx,Frontend/src/test/**
sonar.exclusions=Backend/**/tests/**,Backend/**/test_*.py,Frontend/src/**/*.test.js,Frontend/src/**/*.test.jsx,Frontend/src/test/**,\
  **/migrations/**,**/__pycache__/**,**/node_modules/**,**/.venv/**,\
  Backend/media/**,Backend/staticfiles/**,Backend/htmlcov/**,Frontend/dist/**,Frontend/coverage/**

# Test reports produced by the CI jobs (and by the commands in the README).
sonar.python.version=3.11
sonar.python.coverage.reportPaths=Backend/coverage.xml
sonar.javascript.lcov.reportPaths=Frontend/coverage/lcov.info
# Configuration, scripts and admin registrations are not unit-tested code.
sonar.coverage.exclusions=Backend/manage.py,Backend/config/**,Backend/**/management/**,Backend/**/admin.py,Backend/**/apps.py,\
  Frontend/src/main.jsx

# Reviewed findings, kept here because CI starts a fresh SonarQube on every run:
#  e1/e2: "COPY . ." is safe, .dockerignore keeps .env, .venv, media and node_modules out.
#  e3-e5: the shared demo password of the seeded demo accounts; seed_demo refuses to run
#         with DEBUG=False and the login page only shows it as a demo shortcut.
#  e6: api_not_found answers 404 to every HTTP method on purpose (unknown /api/ URLs).
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S6470
sonar.issue.ignore.multicriteria.e1.resourceKey=Backend/Dockerfile
sonar.issue.ignore.multicriteria.e2.ruleKey=docker:S6470
sonar.issue.ignore.multicriteria.e2.resourceKey=Frontend/Dockerfile
sonar.issue.ignore.multicriteria.e3.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.e3.resourceKey=Backend/accounts/management/commands/seed_demo.py
sonar.issue.ignore.multicriteria.e4.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.e4.resourceKey=Backend/announcements/demo.py
sonar.issue.ignore.multicriteria.e5.ruleKey=javascript:S2068
sonar.issue.ignore.multicriteria.e5.resourceKey=Frontend/src/pages/auth/LoginPage.jsx
sonar.issue.ignore.multicriteria.e6.ruleKey=python:S3752
sonar.issue.ignore.multicriteria.e6.resourceKey=Backend/config/views.py
