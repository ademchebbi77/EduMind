services:
  # ── Django Backend ──────────────────────────────────────────────────────────
  - type: web
    name: edumind-backend
    runtime: python
    rootDir: Backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # fill in after frontend is deployed
      - key: CSRF_TRUSTED_ORIGINS
        sync: false          # fill in after frontend is deployed
      - key: DATABASE_URL
        fromDatabase:
          name: edumind-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: edumind-redis
          type: redis
          property: connectionString
      - key: COOKIE_SECURE
        value: "True"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"        # run Celery tasks inline (no separate worker on free tier)
      - key: AUTO_START_BACKGROUND_SERVICES
        value: "False"
      - key: COHERE_API_KEY
        sync: false
      - key: METRICS_TOKEN
        generateValue: true

  # ── React Frontend ───────────────────────────────────────────────────────────
  - type: web
    name: edumind-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          name: edumind-backend
          type: web
          property: host

databases:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  - name: edumind-db
    databaseName: edumind
    user: edumind
    plan: free

  # ── Redis ────────────────────────────────────────────────────────────────────
  - name: edumind-redis
    plan: free
    ipAllowList: []
