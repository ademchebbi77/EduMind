# EduMind on Render (free plan).
#
# - Database and uploaded files live on Supabase (free Postgres that does not expire +
#   S3-compatible storage), because Render's free disk is wiped on every restart.
# - No background worker on the free plan: Celery jobs (quiz generation, voice
#   questions) run inside the web request (CELERY_TASK_ALWAYS_EAGER).
# - Voice questions are transcribed by Gemini: local Whisper needs more than 512 MB.
#
# Variables marked "sync: false" are secrets: fill them in the Render dashboard.
services:
  # ── Django Backend ──────────────────────────────────────────────────────────
  - type: web
    name: edumind-backend
    runtime: python
    plan: free
    rootDir: Backend
    buildCommand: "bash build.sh"
    # One process (512 MB of RAM), threads for concurrency, long timeout for the AI.
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 300"
    healthCheckPath: /api/config/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      # Exact browser origin(s), comma-separated. Update if you add a custom domain.
      - key: CORS_ALLOWED_ORIGINS
        value: "https://edumind-frontend-i7a5.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://edumind-frontend-i7a5.onrender.com"
      - key: COOKIE_SECURE
        value: "True"

      # Supabase: Project Settings > Database > Connection string > "Session pooler"
      - key: DATABASE_URL
        sync: false
      # Supabase: Storage > S3 configuration (bucket "edumind-media", private)
      - key: AWS_STORAGE_BUCKET_NAME
        value: "edumind-media"
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: AWS_S3_ACCESS_KEY_ID
        sync: false
      - key: AWS_S3_SECRET_ACCESS_KEY
        sync: false

      # Background jobs run in the web process (no Redis, no worker).
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: CELERY_BROKER_URL
        value: "memory://"
      - key: AUTO_START_BACKGROUND_SERVICES
        value: "False"

      # AI
      - key: GEMINI_API_KEY
        sync: false
      - key: VOICE_QA_TRANSCRIPTION_PROVIDER
        value: "gemini"
      - key: COHERE_API_KEY
        sync: false

      - key: ADMIN_REGISTRATION_CODE
        sync: false
      # 1 = add the demo course catalogue on deploy (needs a teacher account first).
      - key: SEED_COURSES
        value: "1"
      - key: METRICS_TOKEN
        generateValue: true

  # ── React Frontend ───────────────────────────────────────────────────────────
  - type: web
    name: edumind-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: "./dist"
    # The frontend calls same-origin /api/* paths. Proxy them to Django before
    # the SPA fallback so the browser can keep the session and CSRF cookies.
    routes:
      - type: rewrite
        source: "/api/*"
        destination: "https://edumind-backend-dhfy.onrender.com/api/*"
      - type: rewrite
        source: "/*"
        destination: "/index.html"
