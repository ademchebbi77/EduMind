services:
  # ── Django Backend ──────────────────────────────────────────────────────────
  - type: web
    name: edumind-backend
    runtime: python
    rootDir: Backend
    buildCommand: "./build.sh"
    preDeployCommand: "python manage.py shell -c \"from accounts.models import User; User.objects.filter(email='admin@edumind.com').exists() or User.objects.create_superuser(email='admin@edumind.com', password='Admin123!', first_name='Admin', last_name='Admin', role='admin')\""
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      # Exact browser origin(s), comma-separated. Update if you add a custom domain.
      - key: CORS_ALLOWED_ORIGINS
        value: "https://edumind-frontend.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://edumind-frontend.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: edumind-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: edumind-redis
          type: redis
          property: connectionString
      - key: COOKIE_SECURE
        value: "True"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"        # run Celery tasks inline (no separate worker on free tier)
      - key: AUTO_START_BACKGROUND_SERVICES
        value: "False"
      - key: COHERE_API_KEY
        sync: false
      - key: METRICS_TOKEN
        generateValue: true

  # ── React Frontend ───────────────────────────────────────────────────────────
  - type: web
    name: edumind-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: "./dist"
    # The frontend calls same-origin /api/* paths. Proxy them to Django before
    # the SPA fallback so the browser can keep the session and CSRF cookies.
    routes:
      - type: rewrite
        source: "/api/*"
        destination: "https://edumind-backend-dhfy.onrender.com/api/*"
      - type: rewrite
        source: "/*"
        destination: "/index.html"

databases:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  - name: edumind-db
    databaseName: edumind
    user: edumind
    plan: free

  # ── Redis ────────────────────────────────────────────────────────────────────
  - name: edumind-redis
    plan: free
    ipAllowList: []
