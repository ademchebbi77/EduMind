# EduMind continuous integration:
#   1. backend   - Django checks + tests with coverage (PostgreSQL service)
#   2. frontend  - ESLint, Vitest with coverage, production build
#   3. sonarqube - SonarQube (in Docker) analysis + quality gate, using both coverages
#   4. docker    - builds the images, starts the whole app and smoke-tests it
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: edumind
          POSTGRES_USER: edumind
          POSTGRES_PASSWORD: edumind_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edumind -d edumind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      DEBUG: "False"
      DB_NAME: edumind
      DB_USER: edumind
      DB_PASSWORD: edumind_ci_password
      DB_HOST: localhost
      DB_PORT: "5432"
      AUTO_START_BACKGROUND_SERVICES: "False"
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Tests with coverage
        run: coverage run --source=. manage.py test --noinput

      - name: Coverage report
        run: |
          coverage xml -o coverage.xml --fail-under=0
          echo "### Backend coverage: $(coverage report --fail-under=0 | tail -n 1 | awk '{print $NF}')" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: Backend/coverage.xml

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Tests with coverage
        run: npx vitest run --coverage --coverage.reporter=lcov --coverage.reporter=text-summary

      - name: Production build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: Frontend/coverage/lcov.info

  sonarqube:
    name: SonarQube analysis
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube uses the Git history (blame, new code)

      - name: Start SonarQube
        run: docker compose -f docker-compose.sonarqube.yml up -d

      - uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: Backend

      - uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: Frontend/coverage

      - name: Analyse and check the quality gate
        run: |
          set -o pipefail
          bash scripts/sonarqube-scan.sh | tee sonar-result.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "### SonarQube"
            echo '```'
            sed -n '/^Quality gate:/,$p' sonar-result.txt 2>/dev/null || echo "No result."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Export the SonarQube issues
        if: always()
        run: |
          curl -s -u admin:admin "http://localhost:9000/api/issues/search?components=edumind&ps=500" > sonarqube-issues.json || true
          curl -s -u admin:admin "http://localhost:9000/api/hotspots/search?projectKey=edumind&ps=500" > sonarqube-hotspots.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonarqube-report
          path: |
            sonar-result.txt
            sonarqube-issues.json
            sonarqube-hotspots.json

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: Backend
          tags: edumind-backend:latest
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: Frontend
          tags: edumind-frontend:latest
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Start the application
        run: docker compose up -d --no-build --wait --wait-timeout 300

      - name: Smoke test
        run: bash scripts/smoke-test.sh http://localhost:8080

      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop
        if: always()
        run: docker compose down -v
